
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101014">

    <title>AltTeam — Downloads</title>
    <meta name="description" content="Download the latest AltTeam releases and source code.">

    <link rel="stylesheet" href="/res/style.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="#">AltTeam<span>.</span></a>
        <a class="github-link"
           href="https://github.com/alx0rr/AltTeam-App"
           target="_blank">
            GitHub ↗
        </a>
    </header>

    <main>
        <section class="hero">
            <div class="eyebrow">OFFICIAL RELEASES</div>
            <h1>Download <span>AltTeam.</span></h1>
            <p>
                Get the latest version of AltTeam for your device,
                or explore the source code.
            </p>
        </section>

        <section class="release-section">
            <div class="section-heading">
                <div>
                    <div class="eyebrow">LATEST VERSION</div>
                    <h2 id="version">Loading...</h2>
                </div>
                <span class="latest-badge">LATEST</span>
            </div>

            <p class="release-date" id="release-date"></p>
            <div class="release-notes" id="release-notes">
                Loading release information...
            </div>

            <div class="downloads">
                <h3>Android</h3>
                <div id="android-files" class="file-list"></div>

                <h3>iOS</h3>
                <div id="ios-files" class="file-list"></div>

                <h3>Source code</h3>
                <div id="source-files" class="file-list"></div>
            </div>
        </section>

        <footer>
            <span>AltTeam © 2026</span>
            <a href="https://github.com/alx0rr/AltTeam-App">
                View repository ↗
            </a>
        </footer>
    </main>

    <script src="/res/app.js"></script>
</body>
</html>
